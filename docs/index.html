<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PhD picker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--mute:#6b6861;--line:#dedbd3;--go:#17613a;--gobg:#e3f1e8;--may:#8a5a00;--maybg:#fbefd2;--no:#9b2c2c;--nobg:#f8e3e1;--acc:#1f4f8f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
a{color:var(--acc)}
#gate{max-width:340px;margin:18vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px}
#gate input{padding:10px;border:1px solid var(--line);border-radius:8px}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
#top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
#top b{font-size:20px}
#top .sp{flex:1}
#top .btn{background:#fff;color:var(--ink);border:0}
#saved{font-size:13px;opacity:.8}
main{max-width:980px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:6px 0 0}
.help{color:var(--mute);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.tab[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab span{opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.filters input[type=search]{flex:1;min-width:180px;padding:8px;border:1px solid var(--line);border-radius:8px}
.filters select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.filters label{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.apply{border-left-color:var(--go)}.card.maybe{border-left-color:var(--may)}.card.no{border-left-color:var(--no);opacity:.6}
.head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.uni{font-weight:700;font-size:18px}
.prog{color:var(--mute)}
.pill{font-size:12.5px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.pass{background:var(--gobg);color:var(--go)}.pill.check{background:var(--maybg);color:var(--may)}.pill.weak{background:#eee;color:#444}.pill.cut{background:var(--nobg);color:var(--no)}
.facts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:820px){.facts{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.facts{grid-template-columns:repeat(2,1fr)}}
.f{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.f small{display:block;color:var(--mute);font-size:12px}
.f b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.f.good b{color:var(--go)}.f.bad b{color:var(--no)}.f.unk b{color:var(--may)}
.flag{background:var(--maybg);border-radius:8px;padding:8px 10px;font-size:14px}
details{font-size:14.5px}
details summary{cursor:pointer;color:var(--acc)}
details dl{margin:8px 0 0;display:grid;grid-template-columns:150px 1fr;gap:6px 12px}
details dt{color:var(--mute)}details dd{margin:0;overflow-wrap:anywhere}
@media(max-width:560px){details dl{grid-template-columns:1fr}}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{flex:1;min-width:92px;padding:11px;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.pick .a.on{background:var(--go);border-color:var(--go);color:#fff}
.pick .m.on{background:var(--may);border-color:var(--may);color:#fff}
.pick .n.on{background:var(--no);border-color:var(--no);color:#fff}
#more{align-self:center}
#lockbox{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
#lockbox textarea{width:100%;height:150px;font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px}
#lockbox ol{margin:0;padding-left:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<form id="gate">
  <b>PhD picker</b>
  <input id="u" placeholder="Username" autocomplete="username" autocapitalize="off">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn primary">Open</button>
  <span id="gerr" class="help"></span>
</form>

<div id="app" hidden>
  <div id="top">
    <span><b id="n-apply">0</b> Apply</span>
    <span><b id="n-maybe">0</b> Maybe</span>
    <span><b id="n-no">0</b> No</span>
    <span>Fees: <b id="n-fee">$0</b></span>
    <span class="sp"></span>
    <span id="saved"></span>
    <button class="btn" id="lock">Lock my list</button>
  </div>
  <main>
    <h1>Choose your PhD programs</h1>
    <p class="help">Each card is one program. Press <b>Apply</b>, <b>Maybe</b> or <b>No</b>. Every press is saved in this browser straight away. When you are done, press <b>Lock my list</b> and send the code to Claude.</p>
    <div id="lockbox" hidden></div>
    <div class="tabs" id="tabs"></div>
    <div class="filters">
      <input type="search" id="q" placeholder="Search university or program">
      <select id="sort">
        <option value="best">Sort: strongest first</option>
        <option value="deadline">Sort: earliest deadline</option>
        <option value="inst">Sort: university A to Z</option>
        <option value="fee">Sort: lowest fee</option>
      </select>
      <label><input type="checkbox" id="f-gre"> No GRE</label>
      <label><input type="checkbox" id="f-eng"> No TOEFL/IELTS for me</label>
      <label><input type="checkbox" id="f-fund"> Funded (guaranteed or most)</label>
      <label><input type="checkbox" id="f-fee"> Free or fee can be waived</label>
      <label><input type="checkbox" id="f-todo"> Hide ones I decided</label>
    </div>
    <div class="help"><b id="shown">0</b> programs shown</div>
    <div id="list"></div>
    <button class="btn" id="more" hidden>Show 30 more</button>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hex = (h) => new Uint8Array(h.match(/../g).map((b) => parseInt(b, 16)));
let P = [], picks = {}, tab = 0, limit = 30;
try { picks = JSON.parse(localStorage.getItem('phd-picker-picks') || '{}'); } catch (e) {}

async function open(u, p) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(u.trim().toLowerCase() + ':' + p), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: hex('d354727ac2f35e0ada6e1e2c217f39c9'), iterations: 100000, hash: 'SHA-256' }, km, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  const enc = await (await fetch('data.enc')).arrayBuffer();
  const plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32) }, key, enc);
  P = JSON.parse(new TextDecoder().decode(plain));
  try { localStorage.setItem('phd-picker-login', JSON.stringify([u, p])); } catch (e) {}
  $('#gate').hidden = true; $('#app').hidden = false;
  render();
}
$('#gate').addEventListener('submit', (e) => {
  e.preventDefault();
  $('#gerr').textContent = 'Opening…';
  open($('#u').value, $('#p').value).catch(() => { $('#gerr').textContent = 'Wrong username or password.'; });
});
try { const l = JSON.parse(localStorage.getItem('phd-picker-login')); if (l) open(l[0], l[1]).catch(() => {}); } catch (e) {}

const BO = { pass: 0, check: 1, weak: 2, cut: 3 };
const STATUS = { pass: 'Clears every gate', check: 'Something not confirmed', weak: 'Funding not guaranteed', cut: 'Fails a gate' };
const phd = (r) => r.degree === 'PhD' || r.degree === 'PhD?';
const pk = (r) => picks[r.key];
const TABS = [
  ['Best picks', (r) => r.bucket !== 'cut' && (r.short || r.locked || (r.bucket === 'pass' && phd(r)))],
  ['Not decided yet', (r) => !pk(r) && r.bucket !== 'cut' && (r.short || r.locked || (r.bucket === 'pass' && phd(r)))],
  ['My Apply', (r) => pk(r) === 'apply'],
  ['My Maybe', (r) => pk(r) === 'maybe'],
  ['My No', (r) => pk(r) === 'no'],
  ['Everything still alive', (r) => r.bucket !== 'cut'],
  ['Failed a gate', (r) => r.bucket === 'cut'],
];
const noGre = (r) => ['not_required', 'not_accepted', 'optional'].includes(r.gre);
const freeFee = (r) => r.fee === 0 || r.fee_waiver === 'yes_international';
function current() {
  const q = $('#q').value.trim().toLowerCase();
  let rows = P.filter(TABS[tab][1]).filter((r) =>
    (!q || (r.inst + ' ' + r.program + ' ' + (r.state || '')).toLowerCase().includes(q)) &&
    (!$('#f-gre').checked || noGre(r)) && (!$('#f-eng').checked || r.eng === 'waived_us_degree') &&
    (!$('#f-fund').checked || r.fund === 'guaranteed' || r.fund === 'most') && (!$('#f-fee').checked || freeFee(r)) &&
    (!$('#f-todo').checked || !pk(r)));
  const s = $('#sort').value;
  const best = (a, b) => BO[a.bucket] - BO[b.bucket] || (b.locked ? 1 : 0) - (a.locked ? 1 : 0) || (a.short || 9) - (b.short || 9) || a.inst.localeCompare(b.inst);
  rows.sort(s === 'deadline' ? (a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999') || best(a, b)
    : s === 'inst' ? (a, b) => a.inst.localeCompare(b.inst) || best(a, b)
    : s === 'fee' ? (a, b) => (a.fee ?? 9999) - (b.fee ?? 9999) || best(a, b) : best);
  return rows;
}
const GRE = { required: ['Required', 'bad'], optional: ['Optional', 'good'], not_required: ['Not required', 'good'], not_accepted: ['Not accepted', 'good'], unknown: ['Not confirmed', 'unk'] };
const FUND = { guaranteed: ['Guaranteed', 'good'], most: ['Most students', 'good'], competitive: ['Competitive', 'unk'], none: ['None', 'bad'], unknown: ['Not confirmed', 'unk'] };
const ENG = { waived_us_degree: ['Not needed (US degree)', 'good'], required: ['TOEFL/IELTS needed', 'bad'] };
const WAIVE = { yes_international: ['Yes, for you', 'good'], yes_some: ['Some waivers', 'unk'], need_based: ['Need-based', 'unk'], domestic_only: ['US applicants only', 'bad'], none: ['None', 'bad'] };
const fmtDate = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
const fact = (label, [v, cls], sub) => `<div class="f ${cls || ''}"><small>${label}</small><b>${esc(v)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
function card(r) {
  const mine = pk(r) || '';
  const fee = r.fee === 0 ? ['Free', 'good'] : r.fee != null ? ['$' + r.fee, ''] : ['Not confirmed', 'unk'];
  const dl = r.deadline ? [fmtDate(r.deadline), ''] : r.deadline_text ? ['Last cycle, see details', 'unk'] : ['Not confirmed', 'unk'];
  const visa = r.online ? ['Online, no F-1', 'bad'] : null;
  const d = [['Why this status', (r.why || []).join('; ')], ['GRE, in their words', r.gre_quote], ['English test, in their words', r.eng_quote], ['English minimum', r.eng_min],
    ['Funding, in their words', r.fund_quote], ['Stipend', r.stipend], ['Years funded', r.fund_years], ['Deadline note', r.deadline_text],
    ['Fee waiver, how', r.fee_waiver_how], ['Taking students for fall 2027', { yes: 'Yes', no: 'No', unknown: 'Not confirmed' }[r.admit]],
    ['STEM field (for OPT)', r.stem === true ? 'Yes' : r.stem === false ? 'No' : ''], ['What to submit', r.materials], ['Faculty', r.faculty],
    ['Advisor rule', r.advisor_rule], ['AI rule for essays', r.ai_rule], ['Field', r.family], ['Notes', r.note],
    ['How this was read', r.read === 'page' ? 'On the official pages, Oct 2026' : r.read ? 'Partly or fully from search summaries. Open the page before you trust it.' : 'Earlier pass, not re-read this month']]
    .filter((x) => x[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  const link = r.url_adm || r.url;
  return `<div class="card ${mine}" data-k="${r.key}">
    <div class="head"><div><div class="uni">${esc(r.inst)}${r.state ? ', ' + esc(r.state) : ''}</div>
      <div class="prog">${esc(r.program)}${r.locked ? ' · <b>in your earlier locked 14</b>' : ''}</div></div>
      <span class="pill ${r.bucket}">${STATUS[r.bucket]}</span></div>
    <div class="facts">${fact('Application fee', fee)}${fact('Fee waiver', WAIVE[r.fee_waiver] || ['Not confirmed', 'unk'])}${fact('GRE', GRE[r.gre] || GRE.unknown)}
      ${fact('English test', ENG[r.eng] || ['Not confirmed', 'unk'], r.eng ? '' : '')}${fact('Funding', visa && r.fund === 'unknown' ? visa : FUND[r.fund] || FUND.unknown, r.stipend ? String(r.stipend).slice(0, 40) : '')}${fact('Deadline', dl)}</div>
    ${r.online ? '<div class="flag">Online program: it cannot sponsor an F-1 visa.</div>' : ''}
    ${r.flags ? `<div class="flag">${esc(r.flags)}</div>` : ''}
    <details><summary>All details</summary><dl>${d}</dl></details>
    <div class="row">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Open the program page</a>` : ''}</div>
    <div class="pick"><button class="a ${mine === 'apply' ? 'on' : ''}" data-p="apply">Apply</button><button class="m ${mine === 'maybe' ? 'on' : ''}" data-p="maybe">Maybe</button><button class="n ${mine === 'no' ? 'on' : ''}" data-p="no">No</button></div>
  </div>`;
}
function counts() {
  const by = { apply: [], maybe: [], no: [] };
  for (const r of P) if (pk(r)) by[pk(r)].push(r);
  $('#n-apply').textContent = by.apply.length; $('#n-maybe').textContent = by.maybe.length; $('#n-no').textContent = by.no.length;
  const unk = by.apply.filter((r) => r.fee == null).length;
  $('#n-fee').textContent = '$' + by.apply.reduce((s, r) => s + (r.fee || 0), 0).toLocaleString() + (unk ? ` + ${unk} not confirmed` : '');
  $('#tabs').innerHTML = TABS.map((t, i) => `<button class="tab" data-t="${i}" aria-pressed="${i === tab}">${t[0]}<span>${P.filter(t[1]).length}</span></button>`).join('');
  return by;
}
function render() {
  counts();
  const rows = current();
  $('#shown').textContent = rows.length;
  $('#list').innerHTML = rows.slice(0, limit).map(card).join('') || '<p class="help">Nothing here.</p>';
  $('#list').style.cssText = 'display:flex;flex-direction:column;gap:12px';
  $('#more').hidden = rows.length <= limit;
}
function save() {
  try { localStorage.setItem('phd-picker-picks', JSON.stringify(picks)); $('#saved').textContent = 'Saved ' + new Date().toLocaleTimeString(); }
  catch (e) { $('#saved').textContent = 'NOT SAVED: this browser blocks storage'; }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('.pick button');
  if (b) {
    const c = b.closest('.card'), k = c.dataset.k;
    if (picks[k] === b.dataset.p) delete picks[k]; else picks[k] = b.dataset.p;
    save();
    c.className = 'card ' + (picks[k] || '');
    c.querySelectorAll('.pick button').forEach((x) => x.classList.toggle('on', x.dataset.p === picks[k]));
    counts();
    return;
  }
  const t = e.target.closest('.tab');
  if (t) { tab = +t.dataset.t; limit = 30; render(); window.scrollTo(0, 0); }
});
$('#more').addEventListener('click', () => { limit += 30; render(); });
for (const id of ['q', 'sort', 'f-gre', 'f-eng', 'f-fund', 'f-fee', 'f-todo']) $('#' + id).addEventListener('input', () => { limit = 30; render(); });

$('#lock').addEventListener('click', () => {
  const by = counts(), box = $('#lockbox');
  const line = (r) => `${r.key} | ${r.inst} | ${r.program}`;
  const text = ['PHD LIST LOCK ' + new Date().toISOString().slice(0, 16), 'APPLY (' + by.apply.length + ')', ...by.apply.map(line), 'MAYBE (' + by.maybe.length + ')', ...by.maybe.map(line),
    'NO (' + by.no.length + ')', by.no.map((r) => r.key).join(' ')].join('\n');
  box.hidden = false;
  box.innerHTML = `<b>Your list: ${by.apply.length} to apply, ${by.maybe.length} maybe</b>
    ${by.maybe.length ? '<span class="help">You still have Maybe programs. You can lock now, or decide them first.</span>' : ''}
    <ol>${by.apply.sort((a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999')).map((r) => `<li>${esc(r.inst)}: ${esc(r.program)}${r.deadline ? ' (due ' + fmtDate(r.deadline) + ')' : ''}</li>`).join('') || '<li>Nothing marked Apply yet.</li>'}</ol>
    <span class="help">To lock: press Copy, then paste it to Claude in the chat. That is the step that makes it final.</span>
    <textarea readonly id="code"></textarea>
    <div class="row"><button class="btn primary" id="copy">Copy</button><button class="btn" id="dl">Download as a file</button><button class="btn" id="close">Close</button><span id="copied" class="help"></span></div>`;
  $('#code').value = text;
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(text); } catch (e) { $('#code').select(); document.execCommand('copy'); } $('#copied').textContent = 'Copied. Now paste it to Claude.'; };
  $('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = 'phd-list.txt'; a.click(); };
  $('#close').onclick = () => { box.hidden = true; };
  window.scrollTo(0, 0);
});
</script>
</body>
</html>
