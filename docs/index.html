<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PhD picker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--mute:#6b6861;--line:#dedbd3;--go:#17613a;--gobg:#e3f1e8;--may:#8a5a00;--maybg:#fbefd2;--no:#9b2c2c;--nobg:#f8e3e1;--acc:#1f4f8f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
a{color:var(--acc)}
#gate{max-width:340px;margin:18vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px}
#gate input{padding:10px;border:1px solid var(--line);border-radius:8px}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
#top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
#top b{font-size:20px}
#top .sp{flex:1}
#top .btn{background:#fff;color:var(--ink);border:0}
#saved{font-size:13px;opacity:.8}
main{max-width:980px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:6px 0 0}
.help{color:var(--mute);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.tab[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab span{opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.filters input[type=search]{flex:1;min-width:180px;padding:8px;border:1px solid var(--line);border-radius:8px}
.filters select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.filters label{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.apply{border-left-color:var(--go)}.card.maybe{border-left-color:var(--may)}.card.no{border-left-color:var(--no);opacity:.6}
.head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.uni{font-weight:700;font-size:18px}
.prog{color:var(--mute)}
.pill{font-size:12.5px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.pass{background:var(--gobg);color:var(--go)}.pill.check{background:var(--maybg);color:var(--may)}.pill.weak{background:#eee;color:#444}.pill.cut{background:var(--nobg);color:var(--no)}
.facts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:820px){.facts{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.facts{grid-template-columns:repeat(2,1fr)}}
.f{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.f small{display:block;color:var(--mute);font-size:12px}
.f b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.f.good b{color:var(--go)}.f.bad b{color:var(--no)}.f.unk b{color:var(--may)}
.flag{background:var(--maybg);border-radius:8px;padding:8px 10px;font-size:14px}
details{font-size:14.5px}
details summary{cursor:pointer;color:var(--acc)}
details dl{margin:8px 0 0;display:grid;grid-template-columns:150px 1fr;gap:6px 12px}
details dt{color:var(--mute)}details dd{margin:0;overflow-wrap:anywhere}
@media(max-width:560px){details dl{grid-template-columns:1fr}}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{flex:1;min-width:92px;padding:11px;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.pick .a.on{background:var(--go);border-color:var(--go);color:#fff}
.pick .m.on{background:var(--may);border-color:var(--may);color:#fff}
.pick .n.on{background:var(--no);border-color:var(--no);color:#fff}
#more{align-self:center}
#lockbox{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
#lockbox textarea{width:100%;height:150px;font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px}
#lockbox ol{margin:0;padding-left:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{flex:1;min-width:150px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.step b{display:block}.step small{color:var(--mute)}
.step[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.step[aria-pressed=true] small{color:#ddd}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:17px;margin:0}
.rule{display:flex;gap:10px;align-items:flex-start}.rule input{margin-top:5px}.rule small{color:var(--mute);display:block}
.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:8px 12px;border:0;background:#fff;cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--go)}
.act{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.act button{flex:1;min-width:70px;padding:14px 6px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px;cursor:pointer}
.act .k{background:var(--go);border-color:var(--go);color:#fff}.act .d{background:var(--no);border-color:var(--no);color:#fff}
.act small{display:block;font-weight:400;opacity:.8;font-size:12px}
.rk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center;cursor:grab}
.rk.over{border-color:var(--acc);box-shadow:0 -3px 0 var(--acc)}
.rk.res{opacity:.75}
.num{font-size:20px;font-weight:700;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.rk-main{flex:1;min-width:0;cursor:pointer}
.mini{font-size:13.5px;color:var(--mute);margin-top:3px}.mini .good{color:var(--go)}.mini .bad{color:var(--no)}.mini .unk{color:var(--may)}
.rk-btn{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.rk-btn button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
.cutline{border-top:3px dashed var(--ink);padding-top:6px;font-weight:600}
#n{width:70px;padding:8px;border:1px solid var(--line);border-radius:8px}
@media(max-width:600px){.rk{flex-wrap:wrap}.rk-btn{width:100%;justify-content:flex-start}}
.subs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}.free{background:var(--go);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px}
.r2{border:2px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.r2.DROP{border-color:var(--no);background:var(--nobg)}.r2.LEAN_DROP{border-color:var(--may);background:var(--maybg)}.r2.KEEP,.r2.STRONG{border-color:var(--go);background:var(--gobg)}
</style>
</head>
<body>
<form id="gate">
  <b>PhD picker</b>
  <input id="u" placeholder="Username" autocomplete="username" autocapitalize="off">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn primary">Open</button>
  <span id="gerr" class="help"></span>
</form>

<div id="app" hidden>
  <div id="top">
    <span>Round <b id="n-round">1</b></span>
    <span><b id="n-todo">0</b> to decide</span>
    <span><b id="n-keep">0</b> kept</span>
    <span><b id="n-drop">0</b> dropped</span>
    <span class="sp"></span>
    <span id="saved"></span>
  </div>
  <main>
    <div class="steps" id="steps"></div>
    <div id="view" style="display:flex;flex-direction:column;gap:14px"></div>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hex = (h) => new Uint8Array(h.match(/../g).map((b) => parseInt(b, 16)));
let P = [], picks = {}, tab = 0, limit = 30;
try { picks = JSON.parse(localStorage.getItem('phd-picker-picks') || '{}'); } catch (e) {}

async function open(u, p) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(u.trim().toLowerCase() + ':' + p), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: hex('d354727ac2f35e0ada6e1e2c217f39c9'), iterations: 100000, hash: 'SHA-256' }, km, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  const enc = await (await fetch('data.enc', { cache: 'no-store' })).arrayBuffer();
  const plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32) }, key, enc);
  P = JSON.parse(new TextDecoder().decode(plain));
  try { localStorage.setItem('phd-picker-login', JSON.stringify([u, p])); } catch (e) {}
  $('#gate').hidden = true; $('#app').hidden = false;
  render();
}
$('#gate').addEventListener('submit', (e) => {
  e.preventDefault();
  $('#gerr').textContent = 'Opening…';
  open($('#u').value, $('#p').value).catch(() => { $('#gerr').textContent = 'Wrong username or password.'; });
});
try { const l = JSON.parse(localStorage.getItem('phd-picker-login')); if (l) open(l[0], l[1]).catch(() => {}); } catch (e) {}


const BO = { pass: 0, check: 1, weak: 2, cut: 3 };
const STATUS = { pass: 'Clears every gate', check: 'Something not confirmed', weak: 'Funding not guaranteed', cut: 'Fails a gate' };
const phd = (r) => r.degree === 'PhD' || r.degree === 'PhD?';
const base = (r) => r.bucket !== 'cut' && !r.dup && (r.short || r.locked || r.late || (r.bucket === 'pass' && phd(r)));
const best = (a, b) => BO[a.bucket] - BO[b.bucket] || (b.locked ? 1 : 0) - (a.locked ? 1 : 0) || (a.short || 9) - (b.short || 9) || a.inst.localeCompare(b.inst);
const weak = (a, b) => ((b.r2 || {}).rank || 0) - ((a.r2 || {}).rank || 0) || best(b, a);
const SORTS = { best, weak, r2: (a, b) => weak(b, a), deadline: (a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999') || best(a, b),
  inst: (a, b) => a.inst.localeCompare(b.inst) || best(a, b), fee: (a, b) => (a.fee ?? 9999) - (b.fee ?? 9999) || best(a, b) };
const SORT_OPTS = '<option value="weak">Lowest score first</option><option value="best">Strongest first</option><option value="deadline">Earliest deadline</option><option value="inst">University A to Z</option><option value="fee">Lowest fee</option>';

// S.d: key -> 'keep' | 'drop'. S.dr: round a program was dropped in. S.extra: programs he added from outside the best picks.
let S = { round: 1, rules: { fee: 'any', fam: [] }, d: {}, dr: {}, extra: [], rank: [], n: 12 };
let view = 'uni', mode = 'one', sub = 'dropped', sortBy = 'best', showIn = 'todo', q = '', hist = [], skipped = [], openK = '', dragK = '';
try {
  const s = JSON.parse(localStorage.getItem('phd-picker-state'));
  if (s) S = s;
  else for (const [k, v] of Object.entries(picks)) { S.d[k] = v === 'no' ? 'drop' : 'keep'; if (v === 'no') S.dr[k] = 1; }
} catch (e) {}
if (S.round >= 2) sortBy = 'weak';
if (S.rules.late === undefined) S.rules.late = true;
function save() {
  try { localStorage.setItem('phd-picker-state', JSON.stringify(S)); $('#saved').textContent = 'Saved ' + new Date().toLocaleTimeString(); }
  catch (e) { $('#saved').textContent = 'NOT SAVED: this browser blocks storage'; }
}

const RULES = [
  ['eng', 'Drop programs that need TOEFL or IELTS from me', (r) => r.eng === 'required', 'needs TOEFL or IELTS'],
  ['fund', 'Drop programs where funding is competitive, not promised', (r) => r.fund === 'competitive' || r.fund === 'none', 'funding is not promised'],
  ['check', 'Drop programs with a key fact still not confirmed', (r) => r.bucket === 'check', 'a key fact is not confirmed'],
  ['late', 'Hold the programs added on 10 Oct for a later round (they have no score yet)', (r) => r.late && !r.sc, 'added 10 Oct, held for a later round'],
];
const FEES = { any: 'Any fee', 0: 'Free, or the fee can be waived for me', 50: 'Up to $50', 75: 'Up to $75', 100: 'Up to $100' };
const feeFail = (r, f) => f !== 'any' && r.fee != null && r.fee > +f && r.fee_waiver !== 'yes_international';
function ruleWhy(r) {
  for (const [id, , fn, why] of RULES) if (S.rules[id] && fn(r)) return why;
  if (feeFail(r, S.rules.fee)) return 'fee is over your limit';
  if ((S.rules.gre || []).includes(r.gre || 'unknown')) return 'GRE rule you switched off';
  if (S.rules.fam.includes(r.family)) return 'field you switched off';
  return '';
}
// One pass over the data: who is in the pool this round, and why the rest are out.
let C = {};
function compute() {
  const cand = P.filter((r) => S.d[r.key] !== 'drop' && (base(r) || S.extra.includes(r.key)));
  const safe = (r) => S.d[r.key] === 'keep' || S.extra.includes(r.key);
  const why = new Map();
  for (const r of cand) { const w = !safe(r) && ruleWhy(r); if (w) why.set(r.key, w); }
  if (S.rules.one) {
    const seen = new Set();
    for (const r of cand.filter((r) => !why.has(r.key)).sort((a, b) => (safe(b) ? 1 : 0) - (safe(a) ? 1 : 0) || best(a, b))) {
      const u = r.inst + '|' + r.state;
      if (seen.has(u) && !safe(r)) why.set(r.key, 'not the top pick at this university');
      seen.add(u);
    }
  }
  const pool = cand.filter((r) => !why.has(r.key));
  C = { cand, why, pool, removed: cand.filter((r) => why.has(r.key)), kept: pool.filter((r) => S.d[r.key] === 'keep'), todo: pool.filter((r) => !S.d[r.key]),
    dropped: P.filter((r) => S.d[r.key] === 'drop' && !r.dup) };
  $('#n-round').textContent = S.round; $('#n-todo').textContent = C.todo.length; $('#n-keep').textContent = C.kept.length; $('#n-drop').textContent = C.dropped.length;
  const sm = { uni: groups().length + ' universities to settle', narrow: C.pool.length + ' programs in play', go: C.todo.length + ' left to decide', rank: C.kept.length + ' kept', out: (C.dropped.length + C.removed.length) + ' set aside' };
  $('#steps').innerHTML = [['uni', 'One per university'], ['narrow', '1. Set rules'], ['go', '2. Keep or drop'], ['rank', '3. Rank and lock'], ['out', 'Left out']]
    .map(([id, t]) => `<button class="step" data-v="${id}" aria-pressed="${id === view}"><b>${t}</b><small>${sm[id]}</small></button>`).join('');
}
function ranked() {
  const pos = new Map(S.rank.map((k, i) => [k, i]));
  return [...C.kept].sort((a, b) => (pos.has(a.key) ? pos.get(a.key) : 1e9) - (pos.has(b.key) ? pos.get(b.key) : 1e9) || ((a.r2 || {}).rank || 999) - ((b.r2 || {}).rank || 999) || best(a, b));
}
function decide(k, v) {
  hist.push([k, S.d[k], S.dr[k]]);
  if (v) S.d[k] = v; else delete S.d[k];
  if (v === 'drop') S.dr[k] = S.round; else delete S.dr[k];
  save(); show();
}

const SUBS = [['fit', 'Faculty fit', 25], ['funding', 'Funding', 20], ['eligibility', 'Eligibility and visa', 15], ['odds', 'Your odds', 15], ['standing', 'Standing', 10], ['certainty', 'Certainty', 7], ['cost', 'Cost to apply', 5], ['gre', 'GRE', 3]];
const V2 = { STRONG: 'Strong keep', KEEP: 'Keep', LEAN_DROP: 'Leaning drop', DROP: 'Drop' };
const GRE = { required: ['Required', 'bad'], optional: ['Optional', 'good'], not_required: ['Not required', 'good'], not_accepted: ['Not accepted', 'good'], unknown: ['Not confirmed', 'unk'] };
const FUND = { guaranteed: ['Guaranteed', 'good'], most: ['Most students', 'good'], competitive: ['Competitive', 'unk'], none: ['None', 'bad'], unknown: ['Not confirmed', 'unk'] };
const ENG = { waived_us_degree: ['Not needed (US degree)', 'good'], required: ['TOEFL/IELTS needed', 'bad'], unclear: ['Unclear for you, see note', 'unk'] };
const WAIVE = { yes_international: ['Yes, for you', 'good'], yes_some: ['Some waivers', 'unk'], need_based: ['Need-based', 'unk'], domestic_only: ['US applicants only', 'bad'], none: ['None', 'bad'] };
const fmtDate = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
const fact = (label, [v, cls], sub) => `<div class="f ${cls || ''}"><small>${label}</small><b>${esc(v)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
function card(r, foot) {
  const mine = { keep: 'apply', drop: 'no' }[S.d[r.key]] || '';
  const fee = r.fee === 0 ? ['Free', 'good'] : r.fee != null ? ['$' + r.fee, ''] : ['Not confirmed', 'unk'];
  const dl = r.deadline ? [fmtDate(r.deadline), ''] : r.deadline_text ? ['Last cycle, see details', 'unk'] : ['Not confirmed', 'unk'];
  const visa = r.online ? ['Online, no F-1', 'bad'] : null;
  const x = r.r2 || {};
  const d = [...(r.sc ? SUBS.filter(([k]) => r.sc.why[k]).map(([k, t, m]) => [`${t}: ${r.sc.sub[k]} of ${m}`, r.sc.why[k]]) : []), ['Faculty fit', x.fit_why], ['Standing', x.rep], ['How selective', x.sel], ['What they expect', x.bar], ['Eligibility and visa', x.elig], ['Money', x.money], ['Outcomes', x.out], ['Red flags', x.red], ['Why this status', (r.why || []).join('; ')], ['GRE, in their words', r.gre_quote], ['English test, in their words', r.eng_quote], ['English minimum', r.eng_min],
    ['Funding, in their words', r.fund_quote], ['Stipend', r.stipend], ['Years funded', r.fund_years], ['Deadline note', r.deadline_text],
    ['Fee waiver, how', r.fee_waiver_how], ['Fee note', r.fee_note], ['Taking students for fall 2027', { yes: 'Yes', no: 'No', unknown: 'Not confirmed' }[r.admit]],
    ['STEM field (for OPT)', r.stem === true ? 'Yes' : r.stem === false ? 'No' : ''], ['What to submit', r.materials], ['Faculty', r.faculty],
    ['Advisor rule', r.advisor_rule], ['AI rule for essays', r.ai_rule], ['Field', r.family], ['Notes', r.note],
    ['How this was read', r.read === 'page' ? 'On the official pages, Oct 2026' : r.read ? 'Partly or fully from search summaries. Open the page before you trust it.' : 'Earlier pass, not re-read this month']]
    .filter((x) => x[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  const link = r.url_adm || r.url;
  return `<div class="card ${mine}" data-k="${r.key}">
    <div class="head"><div><div class="uni">${esc(r.inst)}${r.state ? ', ' + esc(r.state) : ''}${r.fee === 0 ? '<span class="free">FREE TO APPLY</span>' : ''}${r.ap && r.fee !== 0 ? '<span class="free">FEE WAIVER OPEN TO YOU</span>' : ''}</div>
      <div class="prog">${esc(r.program)}${r.locked ? ' · <b>in your earlier locked 14</b>' : ''}</div></div>
      <span class="pill ${r.bucket}">${STATUS[r.bucket]}</span></div>
    <div class="facts">${fact('Application fee', fee)}${fact('Fee waiver', WAIVE[r.fee_waiver] || ['Not confirmed', 'unk'])}${fact('GRE', GRE[r.gre] || GRE.unknown)}
      ${fact('English test', ENG[r.eng] || ['Not confirmed', 'unk'], r.eng ? '' : '')}${fact('Funding', visa && r.fund === 'unknown' ? visa : FUND[r.fund] || FUND.unknown, r.stipend ? String(r.stipend).slice(0, 40) : '')}${fact('Deadline', dl)}</div>
    ${r.online ? '<div class="flag">Online program: it cannot sponsor an F-1 visa.</div>' : ''}
    ${r.r2 ? `<div class="r2 ${r.r2.v}"><b>${r.sc ? `Score ${r.sc.score} of 100 · ${rankOf(r)}` : ''}${V2[r.r2.v] || ''} · confidence ${esc(r.r2.conf || 'not stated')}</b>
      ${r.sc ? `<div class="subs">${SUBS.map(([k, t, m]) => `<span title="${esc(r.sc.why[k] || '')}">${t} <b>${r.sc.sub[k]}</b>/${m}</span>`).join('')}</div>` : ''}
      <div><b>Why drop:</b> ${esc(r.r2.drop)}</div><div><b>Why keep:</b> ${esc(r.r2.keep)}</div></div>` : ''}
    ${r.back ? '<div class="flag"><b>Brought back 10 Oct.</b> It had been excluded; a re-read of the official page did not support that.' + (r.fit0 != null ? ' Reader fit: ' + r.fit0 + ' of 5.' : '') + '</div>' : r.late ? '<div class="flag"><b>Added 10 Oct.</b> A live PhD that was not among the first 350. Its facts have had a lighter read.</div>' : ''}
    ${r.dup ? `<div class="flag">Looks like the same program as one already in play: ${esc(r.dup)}</div>` : ''}
    ${r.flags ? `<div class="flag">${esc(r.flags)}</div>` : ''}
    <details><summary>All details</summary><dl>${d}</dl></details>
    <div class="row">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Open the program page</a>` : ''}</div>
    ${foot}
  </div>`;
}

const mini = (r) => {
  const sp = ([v, c]) => `<span class="${c || ''}">${esc(v)}</span>`;
  return [sp(r.fee === 0 ? ['Free', 'good'] : r.fee != null ? ['$' + r.fee, ''] : ['Fee not confirmed', 'unk']),
    sp(r.gre === 'unknown' || !r.gre ? ['GRE not confirmed', 'unk'] : ['No GRE', 'good']),
    sp({ waived_us_degree: ['No English test', 'good'], required: ['TOEFL/IELTS needed', 'bad'] }[r.eng] || ['English test unclear', 'unk']),
    sp(['Funding: ' + (FUND[r.fund] || FUND.unknown)[0].toLowerCase(), (FUND[r.fund] || FUND.unknown)[1]]),
    sp(r.deadline ? ['Due ' + fmtDate(r.deadline), ''] : ['Deadline not confirmed', 'unk'])].join(' · ');
};
const pickBtns = (r) => `<div class="pick"><button class="n ${S.d[r.key] === 'drop' ? 'on' : ''}" data-p="drop">Drop</button><button class="a ${S.d[r.key] === 'keep' ? 'on' : ''}" data-p="keep">Keep</button></div>`;

// Universities with two or more programs still in play.
function groups() {
  const g = new Map();
  for (const r of (C.pool || [])) { const u = r.inst + (r.state ? ', ' + r.state : ''); if (!g.has(u)) g.set(u, []); g.get(u).push(r); }
  return [...g].filter(([, v]) => v.length > 1).map(([u, v]) => [u, v.sort((a, b) => ((b.sc || {}).score || 0) - ((a.sc || {}).score || 0))])
    .sort((a, b) => ((b[1][0].sc || {}).score || 0) - ((a[1][0].sc || {}).score || 0));
}
function viewUni() {
  const G = groups(), solo = new Set(C.pool.map((r) => r.inst)).size - G.length;
  if (!G.length) return `<h1>One program per university</h1><div class="panel"><h2>Done</h2><span>Every university in play now has one program: ${C.pool.length} programs at ${C.pool.length} universities.</span>
    <div class="row"><button class="btn primary" data-v="go">Next: keep or drop, lowest score first</button></div></div>`;
  return `<h1>One program per university</h1>
    <p class="help">${G.length} universities have more than one of your programs: ${G.reduce((s, x) => s + x[1].length, 0)} programs in all. Press <b>Pick this one</b> and the others at that university are dropped. Highest score is listed first. ${solo} universities already have just one.</p>
    <div class="row"><button class="btn" data-pickall="1">Pick the highest score at all ${G.length}</button><span class="help">You can undo any of them under Left out.</span></div>
    ${G.map(([u, v]) => `<div class="panel"><h2>${esc(u)} <span class="help" style="font-weight:400">${v.length} programs</span></h2>
      ${v.map((r, i) => `<div class="rk" data-k="${r.key}" style="cursor:default"><span class="num">${r.sc ? r.sc.score : '?'}</span>
        <div class="rk-main"><b>${esc(r.program)}</b>${r.fee === 0 ? '<span class="free">FREE</span>' : ''}<div class="mini">${mini(r)}</div>
          ${r.r2 ? `<div class="mini"><b>Against:</b> ${esc(r.r2.drop)}</div><div class="mini"><b>For:</b> ${esc(r.r2.keep)}</div>` : ''}</div>
        <div class="rk-btn"><button data-pick="${r.key}" ${i ? '' : 'style="background:var(--go);color:#fff;border-color:var(--go)"'}>Pick this one</button></div></div>
        ${openK === r.key ? card(r, '') : ''}`).join('')}</div>`).join('')}`;
}
function pickOne(k) {
  const r = P.find((x) => x.key === k);
  for (const x of C.pool) if (x.inst === r.inst && x.state === r.state && x.key !== k) { S.d[x.key] = 'drop'; S.dr[x.key] = S.round; }
}
function viewNarrow() {
  const open = C.cand.filter((r) => S.d[r.key] !== 'keep' && !S.extra.includes(r.key));
  const fams = {};
  for (const r of open) fams[r.family] = (fams[r.family] || 0) + 1;
  for (const f of S.rules.fam) fams[f] = fams[f] || 0;
  return `<h1>Round ${S.round}: set your rules</h1>
    <p class="help">Each rule removes a whole group in one press, so you do not have to go card by card. Nothing is lost: removed programs wait under <b>Left out</b>, and programs you already kept stay.</p>
    <div class="panel"><div class="big">${C.pool.length} programs at ${new Set(C.pool.map((r) => r.inst)).size} universities</div>
      <span class="help">in play this round. ${C.removed.length} removed by your rules. ${C.kept.length} already kept.</span></div>
    <div class="panel"><h2>Rules</h2>
      ${RULES.map(([id, t, fn]) => `<label class="rule"><input type="checkbox" data-rule="${id}" ${S.rules[id] ? 'checked' : ''}><span>${t}<small>${open.filter(fn).length} programs</small></span></label>`).join('')}
      <label class="rule"><input type="checkbox" data-rule="one" ${S.rules.one ? 'checked' : ''}><span>Keep only the strongest program at each university<small>Leaves one per university</small></span></label>
      <label>Application fee: <select id="r-fee">${Object.entries(FEES).map(([v, t]) => `<option value="${v}" ${String(S.rules.fee) === v ? 'selected' : ''}>${t}${v === 'any' ? '' : ' (removes ' + open.filter((r) => feeFail(r, v)).length + ')'}</option>`).join('')}</select></label></div>
    <div class="panel"><h2>GRE</h2><span class="help">Untick a GRE rule to remove those programs. Programs that require the GRE are already out; they sit under Left out, Failed a gate.</span>
      ${[['not_required', 'Not required'], ['not_accepted', 'Not accepted (they will not look at it)'], ['optional', 'Optional (accepted if you send it)'], ['unknown', 'Not confirmed yet']].map(([v, t]) => `<label class="rule"><input type="checkbox" data-gre="${v}" ${(S.rules.gre || []).includes(v) ? '' : 'checked'}><span>${t} <small style="display:inline">${open.filter((r) => (r.gre || 'unknown') === v).length}</small></span></label>`).join('')}</div>
    <div class="panel"><h2>Fields</h2><span class="help">Untick a field to remove it.</span>
      ${Object.keys(fams).sort((a, b) => fams[b] - fams[a]).map((f) => `<label class="rule"><input type="checkbox" data-fam="${esc(f)}" ${S.rules.fam.includes(f) ? '' : 'checked'}><span>${esc(f)} <small style="display:inline">${fams[f]}</small></span></label>`).join('')}</div>
    <button class="btn primary" data-v="go">Next: go through the ${C.todo.length} left to decide</button>`;
}
function viewGo() {
  const total = C.pool.length, done = total - C.todo.length;
  const head = `<h1>Round ${S.round}: keep or drop</h1>
    <div class="filters"><span class="seg"><button data-mode="one" class="${mode === 'one' ? 'on' : ''}">One at a time</button><button data-mode="list" class="${mode === 'list' ? 'on' : ''}">As a list</button></span>
      <select id="sort">${SORT_OPTS}</select>
      ${mode === 'list' ? `<select id="showin"><option value="todo">Left to decide</option><option value="keep">Kept</option><option value="all">Both</option></select><input type="search" id="q" placeholder="Search university or program">` : ''}</div>
    <div class="bar"><i style="width:${total ? Math.round(100 * done / total) : 0}%"></i></div>
    <div class="help">${done} of ${total} decided. ${C.kept.length} kept.</div>`;
  if (!C.todo.length && (mode === 'one' || showIn === 'todo')) return head + `<div class="panel"><h2>Round ${S.round} is done</h2>
      <span>You kept <b>${C.kept.length}</b> programs at ${new Set(C.kept.map((r) => r.inst)).size} universities.</span>
      <span class="help">Too many? Go through only the kept ones again. Each round the list gets shorter.</span>
      <div class="row"><button class="btn primary" data-again="1" ${C.kept.length ? '' : 'disabled'}>Go again with these ${C.kept.length} (round ${S.round + 1})</button>
      <button class="btn" data-v="rank">Rank them</button></div></div>`;
  if (mode === 'one') {
    const r = [...C.todo].sort((a, b) => skipped.indexOf(a.key) - skipped.indexOf(b.key) || SORTS[sortBy](a, b))[0];
    const sib = C.pool.filter((x) => x.inst === r.inst && x.key !== r.key);
    return head + card(r, '') + (sib.length ? `<div class="help">Also in play at this university: ${sib.map((x) => esc(x.program) + (S.d[x.key] ? ' (kept)' : '')).join('; ')}</div>` : '') +
      `<div class="act" data-k="${r.key}"><button class="d" data-do="drop">Drop<small>left arrow</small></button><button data-do="skip">Later<small>down arrow</small></button>
      <button class="k" data-do="keep">Keep<small>right arrow</small></button><button data-do="undo" ${hist.length ? '' : 'disabled'}>Undo<small>Z</small></button></div>`;
  }
  return head + '<div id="list"></div><button class="btn" id="more" hidden>Show 30 more</button>';
}
function fillList() {
  const el = $('#list'); if (!el || view === 'rank') return;
  const src = view === 'go' ? (showIn === 'todo' ? C.todo : showIn === 'keep' ? C.kept : C.pool)
    : { dropped: C.dropped, rules: C.removed, dup: P.filter((r) => r.dup), alive: P.filter((r) => r.bucket !== 'cut' && !r.dup && !base(r) && !S.extra.includes(r.key) && !S.d[r.key]), cut: P.filter((r) => r.bucket === 'cut' && !S.extra.includes(r.key) && !S.d[r.key]) }[sub];
  const rows = src.filter((r) => !q || (r.inst + ' ' + r.program + ' ' + (r.state || '')).toLowerCase().includes(q)).sort(SORTS[sortBy]);
  const foot = (r) => view === 'go' ? pickBtns(r)
    : sub === 'dropped' ? `<div class="flag">You dropped this in round ${S.dr[r.key] || 1}.</div><div class="pick"><button data-p="">Bring back</button></div>`
    : sub === 'rules' ? `<div class="flag">Removed by your rule: ${C.why.get(r.key)}.</div><div class="pick"><button data-p="keep">Keep anyway</button></div>`
    : `<div class="pick"><button data-p="add">Add to my list</button></div>`;
  el.style.cssText = 'display:flex;flex-direction:column;gap:12px';
  el.innerHTML = rows.slice(0, limit).map((r) => card(r, foot(r))).join('') || '<p class="help">Nothing here.</p>';
  $('#more').hidden = rows.length <= limit;
}
function viewOut() {
  const n = { dropped: C.dropped.length, rules: C.removed.length, dup: P.filter((r) => r.dup).length, alive: P.filter((r) => r.bucket !== 'cut' && !r.dup && !base(r) && !S.extra.includes(r.key) && !S.d[r.key]).length, cut: P.filter((r) => r.bucket === 'cut' && !S.extra.includes(r.key) && !S.d[r.key]).length };
  const t = { dropped: 'Dropped by me', rules: 'Removed by my rules', dup: 'Repeats of a program in play', alive: 'Other programs still alive', cut: 'Failed a gate' };
  return `<h1>Left out</h1><p class="help">Everything that is not in play. Any of it can come back.</p>
    <div class="tabs">${Object.keys(t).map((k) => `<button class="tab" data-sub="${k}" aria-pressed="${k === sub}">${t[k]}<span>${n[k]}</span></button>`).join('')}</div>
    <div class="filters"><input type="search" id="q" placeholder="Search university or program"><select id="sort">${SORT_OPTS}</select></div>
    <div id="list"></div><button class="btn" id="more" hidden>Show 30 more</button>`;
}
function viewRank() {
  const R = ranked(), n = Math.max(1, S.n | 0), top = R.slice(0, n);
  const unk = top.filter((r) => r.fee == null).length;
  if (!R.length) return `<h1>Rank and lock</h1><div class="panel">Nothing kept yet. <button class="btn primary" data-v="go">Go to step 2</button></div>`;
  return `<h1>Rank and lock</h1>
    <p class="help">Best first. Drag a row, or use the arrows. Press a name to see its details. Programs above the line are the ones you apply to. The rest are your reserve.</p>
    <div class="filters"><label>I will apply to <input type="number" id="n" min="1" value="${n}"> programs</label>
      <span>Order them for me:</span><button class="btn" data-ord="r2">Score out of 100</button><button class="btn" data-ord="best">First strength</button><button class="btn" data-ord="deadline">Deadline</button><button class="btn" data-ord="fee">Fee</button></div>
    ${C.todo.length ? `<div class="flag">${C.todo.length} programs are still undecided in step 2. They are not in this ranking.</div>` : ''}
    <div id="rank" style="display:flex;flex-direction:column;gap:8px">${R.map((r, i) => `${i === n ? `<div class="cutline">Above: ${top.length} to apply, fees $${top.reduce((s, x) => s + (x.fee || 0), 0).toLocaleString()}${unk ? ' + ' + unk + ' not confirmed' : ''}. Below: ${R.length - n} in reserve.</div>` : ''}
      <div class="rk ${i >= n ? 'res' : ''}" draggable="true" data-k="${r.key}"><span class="num">${i + 1}</span>
        <div class="rk-main"><b>${r.sc ? r.sc.score + ' · ' : ''}${esc(r.inst)}</b>${r.fee === 0 ? '<span class="free">FREE</span>' : ''}<div class="prog">${esc(r.program)}</div><div class="mini">${mini(r)}</div></div>
        <div class="rk-btn"><button data-mv="top">Top</button><button data-mv="-1" aria-label="Up">&#9650;</button><button data-mv="1" aria-label="Down">&#9660;</button><button data-mv="drop">Drop</button></div></div>
      ${openK === r.key ? card(r, '') : ''}`).join('')}</div>
    <div class="row"><button class="btn primary" id="lock">Lock my list</button><span class="help">Makes a code to paste to Claude. You can lock again after another round.</span></div>
    <div id="lockbox" hidden></div>`;
}
// Rank among the programs still in play this round, leaving out the ones kept by his free-or-waiver rule.
function rankOf(r) {
  if (r.ap) return 'kept by your free or waiver rule · ';
  const L = C.pool.filter((x) => x.sc && !x.ap);
  if (!L.includes(r)) return '';
  return `ranked ${L.filter((x) => x.sc.score > r.sc.score).length + 1} of ${L.length} still in play · `;
}
let seeded = false;
function show() {
  // One-time move to round 3, for a browser with marks or without.
  if (!seeded && P.length) {
    seeded = true;
    if (!S.m3) {
      // Round 3 starts from his round 1 drops plus his round 2 marks. Drops he made since stay; keeps go back to undecided.
      for (const r of P) {
        if (r.r1 === 'd') { S.d[r.key] = 'drop'; S.dr[r.key] = 1; }
        else if (r.rest) { delete S.d[r.key]; delete S.dr[r.key]; }
        else if (r.r2d && !S.d[r.key]) { S.d[r.key] = 'drop'; S.dr[r.key] = 2; }
        else if (S.d[r.key] === 'keep') delete S.d[r.key];
      }
      S.round = 3; S.m3 = 1; sortBy = 'weak'; view = 'go'; save();
    }
    if (!S.m5 && P.some((r) => r.ap)) {
      // His rule: apply to every program that is free or has a waiver open to him. Those are kept for him.
      for (const r of P) if (r.ap) { S.d[r.key] = 'keep'; delete S.dr[r.key]; }
      S.m5 = 1; save();
    }
    if (!S.m6 && P.some((r) => r.ap2)) {
      // His word of 10 Oct: every addition joins round 3, and the free ones are kept.
      S.rules.late = false;
      for (const r of P) if (r.ap2 && !S.d[r.key]) S.d[r.key] = 'keep';
      S.m6 = 1; save();
    }
    if (!S.m7 && P.some((r) => r.s3)) {
      // Research of 10 Oct on the additions: a "free" entry that did not hold up leaves the kept list, a confirmed one joins it.
      for (const r of P) {
        if (r.unap && S.d[r.key] === 'keep') delete S.d[r.key];
        if (r.ap2 && !S.d[r.key]) S.d[r.key] = 'keep';
      }
      S.rules.late = false; S.m7 = 1; save();
    }
  }
  compute();
  const y = window.scrollY;
  const banner = S.round === 1 && C.kept.length ? `<div class="panel" style="border:2px solid var(--go)"><h2>Round 2 is ready</h2>
    <span>Your ${C.kept.length} kept programs now have a score out of 100 and a case to drop or keep. Round 2 shows them one at a time, lowest score first.</span>
    <div class="row"><button class="btn primary" data-again="go">Start round 2</button></div></div>` : '';
  $('#view').innerHTML = banner + { uni: viewUni, narrow: viewNarrow, go: viewGo, rank: viewRank, out: viewOut }[view]();
  if ($('#sort')) $('#sort').value = sortBy;
  if ($('#showin')) $('#showin').value = showIn;
  if ($('#q')) $('#q').value = q;
  fillList();
  window.scrollTo(0, y);
}
const render = show;
function move(k, to) {
  const keys = ranked().map((r) => r.key), i = keys.indexOf(k);
  keys.splice(i, 1); keys.splice(Math.max(0, Math.min(keys.length, to)), 0, k);
  S.rank = keys; save(); show();
}

document.addEventListener('click', (e) => {
  const on = (s) => e.target.closest(s);
  let b;
  if ((b = on('[data-v]'))) { view = b.dataset.v; limit = 30; q = ''; show(); window.scrollTo(0, 0); }
  else if ((b = on('[data-pick]'))) { pickOne(b.dataset.pick); save(); show(); }
  else if ((b = on('[data-pickall]'))) { for (const [, v] of groups()) pickOne(v[0].key); save(); show(); window.scrollTo(0, 0); }
  else if ((b = on('[data-mode]'))) { mode = b.dataset.mode; show(); }
  else if ((b = on('[data-sub]'))) { sub = b.dataset.sub; limit = 30; show(); }
  else if ((b = on('.act button'))) act(b.dataset.do);
  else if ((b = on('.pick button'))) {
    const k = b.closest('.card').dataset.k, p = b.dataset.p;
    if (p === 'add' || view === 'out' && p === 'keep') { S.extra.push(k); decide(k, 'keep'); }
    else decide(k, S.d[k] === p ? '' : p);
  }
  else if ((b = on('[data-again]'))) {
    S.round++; for (const r of C.kept) delete S.d[r.key];
    hist = []; skipped = []; sortBy = 'weak'; mode = 'one'; view = b.dataset.again === 'go' ? 'go' : 'narrow'; save(); show(); window.scrollTo(0, 0);
  }
  else if ((b = on('[data-ord]'))) { S.rank = [...C.kept].sort(SORTS[b.dataset.ord]).map((r) => r.key); save(); show(); }
  else if ((b = on('[data-mv]'))) {
    const k = b.closest('.rk').dataset.k, i = ranked().findIndex((r) => r.key === k), m = b.dataset.mv;
    if (m === 'drop') decide(k, 'drop'); else move(k, m === 'top' ? 0 : i + +m);
  }
  else if ((b = on('.rk-main'))) { const k = b.closest('.rk').dataset.k; openK = openK === k ? '' : k; show(); }
  else if (on('#more')) { limit += 30; fillList(); }
  else if (on('#lock')) lock();
});
function act(what) {
  const a = $('.act'); if (!a || view !== 'go') return;
  const k = a.dataset.k;
  if (what === 'undo') { const h = hist.pop(); if (!h) return; if (h[1]) S.d[h[0]] = h[1]; else delete S.d[h[0]]; if (h[2]) S.dr[h[0]] = h[2]; else delete S.dr[h[0]]; save(); show(); }
  else if (what === 'skip') { skipped = skipped.filter((x) => x !== k); skipped.push(k); show(); }
  else decide(k, what);
  window.scrollTo(0, 0);
}
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.metaKey || e.ctrlKey) return;
  const w = { ArrowRight: 'keep', ArrowLeft: 'drop', ArrowDown: 'skip', z: 'undo', Z: 'undo' }[e.key];
  if (w && $('.act')) { e.preventDefault(); act(w); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.rule) S.rules[t.dataset.rule] = t.checked;
  else if (t.id === 'r-fee') S.rules.fee = t.value;
  else if (t.dataset.fam) S.rules.fam = t.checked ? S.rules.fam.filter((f) => f !== t.dataset.fam) : [...S.rules.fam, t.dataset.fam];
  else if (t.dataset.gre) S.rules.gre = t.checked ? (S.rules.gre || []).filter((g) => g !== t.dataset.gre) : [...(S.rules.gre || []), t.dataset.gre];
  else if (t.id === 'n') S.n = Math.max(1, +t.value || 1);
  else if (t.id === 'sort') { sortBy = t.value; show(); return; }
  else if (t.id === 'showin') { showIn = t.value; show(); return; }
  else return;
  save(); show();
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { q = e.target.value.trim().toLowerCase(); limit = 30; fillList(); } });
document.addEventListener('dragstart', (e) => { const r = e.target.closest && e.target.closest('.rk'); if (r) dragK = r.dataset.k; });
document.addEventListener('dragover', (e) => { const r = e.target.closest('.rk'); if (r && dragK) { e.preventDefault(); document.querySelectorAll('.rk.over').forEach((x) => x.classList.remove('over')); r.classList.add('over'); } });
document.addEventListener('drop', (e) => {
  const r = e.target.closest('.rk'); if (!r || !dragK) return;
  e.preventDefault();
  const keys = ranked().map((x) => x.key), from = keys.indexOf(dragK), to = keys.indexOf(r.dataset.k);
  const k = dragK; dragK = ''; if (from !== to) move(k, to);
});

function lock() {
  const R = ranked(), n = Math.max(1, S.n | 0), box = $('#lockbox');
  const line = (r, i) => `${i + 1} | ${r.key} | ${r.inst} | ${r.program}`;
  const rules = [...RULES.filter(([id]) => S.rules[id]).map((x) => x[1]), S.rules.one ? 'One per university' : '', S.rules.fee !== 'any' ? 'Fee: ' + FEES[S.rules.fee] : '', ...(S.rules.gre || []).map((g) => 'GRE off: ' + g), ...S.rules.fam.map((f) => 'Field off: ' + f)].filter(Boolean);
  const text = ['PHD LIST LOCK ' + new Date().toISOString().slice(0, 16) + ' round ' + S.round, 'RULES: ' + (rules.join('; ') || 'none'),
    'APPLY, ranked (' + Math.min(n, R.length) + ')', ...R.slice(0, n).map(line), 'RESERVE, ranked (' + Math.max(0, R.length - n) + ')', ...R.slice(n).map((r, i) => line(r, i + n)),
    'UNDECIDED (' + C.todo.length + ')', C.todo.map((r) => r.key).join(' '), 'DROPPED (' + C.dropped.length + ')', C.dropped.map((r) => r.key).join(' ')].join('\n');
  box.hidden = false;
  box.innerHTML = `<b>Your list: ${Math.min(n, R.length)} to apply, ${Math.max(0, R.length - n)} in reserve</b>
    <span class="help">To lock: press Copy, then paste it to Claude in the chat. That is the step that makes it final.</span>
    <textarea readonly id="code"></textarea>
    <div class="row"><button class="btn primary" id="copy">Copy</button><button class="btn" id="dl">Download as a file</button><span id="copied" class="help"></span></div>`;
  $('#code').value = text;
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(text); } catch (e) { $('#code').select(); document.execCommand('copy'); } $('#copied').textContent = 'Copied. Now paste it to Claude.'; };
  $('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = 'phd-list.txt'; a.click(); };
  box.scrollIntoView({ block: 'center' });
}
